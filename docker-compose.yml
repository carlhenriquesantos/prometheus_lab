services:
  app:
    build: ./app
    container_name: monitor-api
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting/alert-rules.yml:/etc/grafana/provisioning/alerting/alert-rules.yml:ro
      - ./grafana/provisioning/alerting/notification-policies.yml:/etc/grafana/provisioning/alerting/notification-policies.yml:ro
    configs:
      - source: grafana_telegram_contact_point
        target: /etc/grafana/provisioning/alerting/contact-points.yml
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

configs:
  # Contact point do Telegram gerado pelo Compose a partir do .env (fora do Git).
  # A substituição é feita aqui, e não pelo Grafana, porque o Grafana converte
  # um chat ID numérico vindo de variável em número e rejeita o provisionamento.
  # Sem .env, os valores padrão deixam o Grafana subir; só o envio ao Telegram falha.
  grafana_telegram_contact_point:
    content: |
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: telegram
          receivers:
            - uid: telegram-grafana-monitor
              type: telegram
              settings:
                bottoken: "${TELEGRAM_BOT_TOKEN:-nao-configurado}"
                chatid: "${TELEGRAM_CHAT_ID:-0}"
              disableResolveMessage: false
